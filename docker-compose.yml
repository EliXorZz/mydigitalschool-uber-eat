services:
  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: uber_eat_app
    restart: on-failure
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uber_eat}
      DB_USERNAME: ${DB_USERNAME:-uber_eat}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - uber_eat

  nginx:
    image: nginx:alpine
    container_name: uber_eat_nginx
    restart: on-failure
    ports:
      - "8000:80"
    volumes:
      - ./api:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - uber_eat

  db:
    image: mariadb:11
    container_name: uber_eat_db
    restart: on-failure
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${DB_DATABASE:-uber_eat}
      MARIADB_USER: ${DB_USERNAME:-uber_eat}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uber_eat

  redis:
    image: redis
    container_name: uber_eat_redis
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - uber_eat

volumes:
  db_data:
  app_storage:

networks:
  uber_eat:
    driver: bridge
