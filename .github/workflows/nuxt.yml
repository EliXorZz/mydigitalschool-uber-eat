name: Nuxt Workflow

on:
  push:
    branches: [ "master" ]
    paths:
      - 'front/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'front/**'
  workflow_dispatch:

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest unit tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Log into registry ${{ vars.HARBOR_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: robot$github
          password: ${{ vars.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./front
          file: ./front/Dockerfile

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ vars.HARBOR_REGISTRY }}/private/uber_eat:main-${{ github.sha }}-${{ github.run_number }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  reconcile:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Flux reconcile
        run: curl -X POST -f --silent --show-error "http://flux.server.dylanbattig.fr${{ vars.FLUX_HOOK }}"