name: API Build

on:
  push:
    branches: [ "master" ]
    paths:
      - 'api/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'api/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: uber_eat_test
          MARIADB_USER: uber_eat
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, pdo_sqlite, gd, bcmath, pcntl
          coverage: none

      - name: Copy environment file
        working-directory: ./api
        run: cp .env.example .env

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        working-directory: ./api
        run: php artisan key:generate

      - name: Run migrations (SQLite in-memory via phpunit.xml)
        working-directory: ./api
        run: php artisan migrate --env=testing --force

      - name: Run tests
        working-directory: ./api
        run: php artisan test --parallel

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Log into registry ${{ vars.HARBOR_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: robot$github
          password: ${{ vars.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.0.0
        with:
          context: ./api
          file: ./api/Dockerfile

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ vars.HARBOR_REGISTRY }}/private/uber_eat_api:main-${{ github.sha }}-${{ github.run_number }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  reconcile:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Flux reconcile
        run: curl -X POST -f --silent --show-error "http://flux.server.dylanbattig.fr${{ vars.FLUX_HOOK }}"
